name: Backend

on:
  push:
    branches: [claude/forge-fitness-frontend-TwlOQ]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python Tests & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Unit tests
        run: python3 scripts/run_tests.py

      - name: Package Lambda artifact
        run: python3 scripts/package_lambda.py

      - name: Smoke test (local dev server)
        run: |
          python3 backend/dev_server.py &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health >/dev/null; then
              break
            fi
            sleep 1
          done
          FORGE_API_BASE_URL=http://127.0.0.1:3001 python3 scripts/smoke_test.py