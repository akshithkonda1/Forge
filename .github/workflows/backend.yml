# Replaced by deploy-chain.yml (Phase 1 · Test Backend).
# Kept for manual reruns of backend tests only.

name: Backend (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Tests & Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - run: pip install -r backend/requirements.txt
      - run: python3 backend/tools/run_tests.py
      - run: python3 backend/tools/ci_fix_improve.py
      - run: |
          python3 backend/dev/server.py &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3001/health >/dev/null && break
            sleep 1
          done
          FORGE_API_BASE_URL=http://127.0.0.1:3001 python3 backend/tools/smoke_test.py