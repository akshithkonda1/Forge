# Weekly: ask Amazon Bedrock which Claude / Grok models exist and, when an
# ARIA model slot has a newer model in its family, open (or refresh) one draft
# PR that bumps the default id everywhere — Lambda code, Terraform fallbacks,
# SimRunner mirrors, and the tests that pin them. See
# scripts/update_model_ids.py. Nothing changes in any environment until that
# PR is merged and applied.
#
# Setup (once):
#   - AWS credentials, the same secrets terraform.yml uses: AWS_ROLE_ARN
#     (OIDC, preferred) or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY. The role
#     needs only bedrock:ListFoundationModels and bedrock:ListInferenceProfiles.
#     Without credentials the live job fails closed (same spirit as other CI
#     skips). Offline unit tests still run on every event so pull_request
#     checks are a real gate without AWS.
#   - Settings → Actions → General → "Allow GitHub Actions to create and
#     approve pull requests".
#   - Optional MODEL_IDS_TOKEN (fine-grained PAT: contents + pull requests on
#     this repo). A PR opened with the default GITHUB_TOKEN does not trigger
#     the other CI workflows; one opened with this token does.
#
# pull_request is unfiltered so required checks always report. Push keeps a
# path filter and is limited to main (same pattern as swift.yml). The live
# Bedrock lookup (contents/pull-requests/id-token write) stays on schedule /
# workflow_dispatch. Offline tests do not verify that a model id exists on
# Bedrock; only the live lookup does that.

name: Model IDs

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - ".github/workflows/model-ids.yml"
      - "scripts/update_model_ids.py"
      - "backend/tests/test_update_model_ids.py"

# Workflow default is read-only. Write scopes live only on the `update` job,
# which is gated to schedule / workflow_dispatch (see that job's `if:`).
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  BRANCH: automation/model-ids

jobs:
  health-leak:
    uses: ./.github/workflows/health-leak-gate.yml

  # PR / merge_group / push path. Read-only token; no id-token; checkout does
  # not persist credentials. Group includes event_name so schedule, dispatch,
  # and push to main (all refs/heads/main) cannot cancel each other. Cancel
  # in-progress only on pull_request so a later commit on the same PR still
  # supersedes, while a second dispatch waits instead of killing the first.
  offline-tests:
    name: model-ids
    needs: health-leak
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: model-ids-offline-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # Actions must be pinned to a full-length commit SHA (repo policy).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Offline: no AWS. Proves the updater and the tests that pin the
      # defaults still agree, so a missing-secrets schedule is not a no-op.
      - name: Offline model-id tests
        run: python3 -m unittest discover -s backend/tests -p "test_update_model_ids.py" -v

  # Write / OIDC path. Never runs on pull_request, merge_group, or push, so
  # PR-controlled Python cannot see contents: write, pull-requests: write, or
  # id-token: write. Schedule and dispatch share one non-cancelling group so
  # they cannot race on git push --force automation/model-ids.
  update:
    name: model-ids (live)
    needs: offline-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: model-ids-live
      cancel-in-progress: false
    steps:
      # Actions must be pinned to a full-length commit SHA (repo policy).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Offline: no AWS. Proves the updater and the tests that pin the
      # defaults still agree, so a missing-secrets skip is not a no-op green.
      - name: Offline model-id tests
        run: python3 -m unittest discover -s backend/tests -p "test_update_model_ids.py" -v

      - name: Check AWS credentials are configured
        id: creds
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ] || { [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; }; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No AWS credentials (AWS_ROLE_ARN or access keys). Skipping the live Bedrock lookup. Offline tests already ran. Configure the same secrets terraform.yml uses to enable the weekly bump PR."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.configured == 'true'

      - name: Configure AWS credentials
        if: steps.creds.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Look for newer models
        id: bump
        if: steps.creds.outputs.configured == 'true'
        run: |
          python3 -m pip install --user boto3
          python3 scripts/update_model_ids.py --region "$AWS_REGION" --summary "$RUNNER_TEMP/model-ids.md"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The bump PR should never arrive red: prove the rewritten defaults and
      # the tests that pin them still agree before opening it.
      - name: Test the bump
        if: steps.bump.outputs.changed == 'true'
        run: |
          python3 -m pip install --user -r backend/requirements-dev.txt
          python3 -m unittest discover -s backend/tests -p "test_*.py"
          python3 -m unittest discover -s backend/ai/simrunner/tests -p "test_*.py"

      - name: Open or refresh the draft PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MODEL_IDS_TOKEN || github.token }}
        run: |
          {
            echo "Weekly Bedrock model check found newer models for ARIA's slots."
            echo
            cat "$RUNNER_TEMP/model-ids.md"
            echo
            echo "Before merging: confirm Bedrock model access for the new ids in this account, then smoke-test /ai/chat with ARIA_BEDROCK_ENABLED on."
          } > "$RUNNER_TEMP/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "chore(models): bump ARIA Bedrock model ids to newest available"
          git push --force origin "$BRANCH"
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --draft --base main --head "$BRANCH" \
              --title "chore(models): newest Bedrock model ids for ARIA" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
