# Gates the backend Python test suite (lambda handler + ARIA engine + biometrics).
# These ~101 tests previously ran in no CI workflow. Stdlib-only (boto3 is lazy),
# so the runner's system python3 is sufficient — no setup-python needed.

name: Backend CI

# Runs on every branch and every pull request — main included. Path filters scope
# it to the backend; there is deliberately no branch filter.
on:
  push:
    paths:
      - "tests/**"
      - "infra/terraform/lambda/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "tests/**"
      - "infra/terraform/lambda/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Backend unit tests (lambda + ARIA + biometrics)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
