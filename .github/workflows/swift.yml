# Build ForgeSwift (iOS) + ForgeWatch (watchOS) and test ForgeCore on macOS.

name: Swift

# Runs on every branch and every pull request. Path filters keep it off changes
# that cannot affect the app; branch filters are deliberately absent so main and
# feature branches are gated identically.
on:
  push:
    paths:
      - "ForgeSwift/**"
      - ".github/workflows/swift.yml"
  pull_request:
    paths:
      - "ForgeSwift/**"
      - ".github/workflows/swift.yml"

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared xcodebuild flags — no signing in CI.
  XCODE_FLAGS: >-
    CODE_SIGNING_ALLOWED=NO
    CODE_SIGN_IDENTITY=
    ONLY_ACTIVE_ARCH=NO
    EXCLUDED_ARCHS=x86_64

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ForgeSwift

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Show Xcode / platforms
        run: |
          xcodebuild -version
          xcrun simctl list runtimes 2>/dev/null | head -40 || true
          xcodebuild -project ForgeSwift.xcodeproj -list

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ForgeSwift.xcodeproj \
            -scheme ForgeSwift

      - name: Test ForgeCore
        run: |
          cd ForgeCore
          swift test

      - name: Build ForgeSwift (iOS Simulator)
        run: |
          set -euo pipefail
          # Build only the iOS application target without forcing the
          # ForgeWatch scheme dependency graph used by local Xcode schemes.
          # Explicit -target still honors pbxproj target dependencies if any;
          # we temporarily rely on skipping watch by not selecting the scheme.
          xcodebuild \
            -project ForgeSwift.xcodeproj \
            -scheme ForgeSwift \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -skipPackagePluginValidation \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=x86_64 \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee /tmp/ios-build.log

      # xcodebuild logs run to ~2000 lines and bury `error:` lines thousands of
      # lines above the failure summary, which makes a red build genuinely hard
      # to diagnose from the web UI. Echo just the diagnostics at the end.
      - name: Compile errors (iOS)
        if: failure()
        run: |
          echo "::group::Swift errors"
          test -f /tmp/ios-build.log || { echo "(build did not reach this step)"; exit 0; }
          grep -E "error: " /tmp/ios-build.log | sed 's|/Users/runner/work/Forge/Forge/||' | sort -u || echo "(no error: lines matched)"
          echo "::endgroup::"

      - name: Build ForgeWatch + Widgets (watchOS Simulator)
        # Scheme builds ForgeWatch and embeds ForgeWatchWidgets with package
        # products resolved. Do not use bare -target for widgets — SPM product
        # linkage (ForgeCore) is not applied the same way without the scheme.
        run: |
          set -euo pipefail
          xcodebuild \
            -project ForgeSwift.xcodeproj \
            -scheme ForgeWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            -skipPackagePluginValidation \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            WATCHOS_DEPLOYMENT_TARGET=10.0 \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee /tmp/watch-build.log

      - name: Compile errors (watchOS)
        if: failure()
        run: |
          echo "::group::Swift errors"
          test -f /tmp/watch-build.log || { echo "(build did not reach this step)"; exit 0; }
          grep -E "error: " /tmp/watch-build.log | sed 's|/Users/runner/work/Forge/Forge/||' | sort -u || echo "(no error: lines matched)"
          echo "::endgroup::"
