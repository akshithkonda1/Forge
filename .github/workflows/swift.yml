# Build the ForgeSwift Xcode project on macOS runners.

name: Swift

on:
  push:
    branches: [ "claude/forge-fitness-frontend-TwlOQ" ]
    paths:
      - "ForgeSwift/**"
      - ".github/workflows/swift.yml"
  pull_request:
    branches: [ "claude/forge-fitness-frontend-TwlOQ" ]
    paths:
      - "ForgeSwift/**"
      - ".github/workflows/swift.yml"

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ForgeSwift

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Build ForgeSwift
        run: |
          xcodebuild \
            -project ForgeSwift.xcodeproj \
            -scheme ForgeSwift \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64