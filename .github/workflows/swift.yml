# Replaced by deploy-chain.yml (Phase 1 · Test Swift).
# Kept for manual Swift builds only.

name: Swift (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ForgeSwift
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n1)"
      - run: |
          xcodebuild build \
            -project ForgeSwift/ForgeSwift.xcodeproj \
            -scheme ForgeSwift \
            -destination 'generic/platform=iOS Simulator' \
            -destination-timeout 5 \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES