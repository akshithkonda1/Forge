name: Swift

on:
  push:
    branches: [claude/forge-fitness-frontend-TwlOQ]
    paths:
      - 'ForgeSwift/**'
      - 'Forge.xcworkspace/**'
      - '.github/workflows/swift.yml'
  pull_request:
    paths:
      - 'ForgeSwift/**'
      - 'Forge.xcworkspace/**'
      - '.github/workflows/swift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ForgeSwift
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n1)"

      - name: Build
        run: |
          xcodebuild build \
            -project ForgeSwift/ForgeSwift.xcodeproj \
            -scheme ForgeSwift \
            -destination 'generic/platform=iOS Simulator' \
            -destination-timeout 5 \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES