# Build ForgeSwift (iOS 27) + ForgeWatch (watchOS 27) and test ForgeCore on macOS.

name: Swift

# pull_request is unfiltered so required checks always report. Push stays
# limited to main and the Swift/widget paths. The heavy job no-ops green
# when nothing Swift-relevant changed.
on:
  push:
    branches: [main]
    paths:
      - "ForgeSwift/**"
      - "ForgeWidget/**"
      - ".github/workflows/swift.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deployment targets are deliberately NOT passed to xcodebuild. The project
  # sets IPHONEOS/WATCHOS_DEPLOYMENT_TARGET=27.0 across all fourteen build
  # configurations, and that is what ships; a flag here would be a second place
  # to remember, which is the only way the two can disagree.
  #
  # They did disagree. The overrides existed as four literals, and #156 raised
  # the two Debug ones to 27.0 and left Release at 17.0 and 10.0. Release then
  # built against a floor the code no longer supports and failed on
  # `'FoundationModelsResponseGenerator' is only available in iOS 26.0 or
  # newer` — in the configuration that actually ships, while Debug stayed
  # green. Building anything other than what the project declares means CI is
  # testing a configuration no user will ever run.

  # Shared xcodebuild flags — no signing in CI.
  XCODE_FLAGS: >-
    CODE_SIGNING_ALLOWED=NO
    CODE_SIGN_IDENTITY=
    ONLY_ACTIVE_ARCH=NO
    EXCLUDED_ARCHS=x86_64

jobs:
  changes:
    name: swift-changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - "ForgeSwift/**"
              - "ForgeWidget/**"
              - ".github/workflows/swift.yml"

  build:
    name: swift-build
    needs: changes
    # Xcode 27 / iOS 27 / watchOS 27 when Swift sources changed. The no-op
    # path stays on ubuntu-latest so a non-Swift PR does not start macOS.
    # macos-15 ships Xcode 16 and cannot compile a deployment target of 27.
    runs-on: ${{ needs.changes.outputs.relevant == 'true' && 'xcode-27' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ForgeSwift

    steps:
      - name: No-op (no relevant changes)
        if: needs.changes.outputs.relevant != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "No Swift changes; succeeding as a no-op so required checks report. runner_os=${RUNNER_OS}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.relevant == 'true'

      - name: Show Xcode / platforms
        if: needs.changes.outputs.relevant == 'true'
        run: |
          xcodebuild -version
          xcrun simctl list runtimes 2>/dev/null | head -40 || true
          xcodebuild -project ForgeSwift.xcodeproj -list

      - name: Resolve package dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ForgeSwift.xcodeproj \
            -scheme ForgeSwift

      - name: Test ForgeCore
        if: needs.changes.outputs.relevant == 'true'
        run: |
          cd ForgeCore
          swift test

      - name: Run ForgeSwiftTests (iOS Simulator)
        if: needs.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          # Compiling the test bundle is not running it. A green Swift job
          # that never executes ForgeSwiftTests is a lie. Prefer a booted
          # iOS Simulator destination when the runner has one.
          python3 - <<'PY'
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(raw)
          devices = []
          for runtime, rows in (data.get("devices") or {}).items():
              if "iOS" not in runtime:
                  continue
              for row in rows or []:
                  if row.get("isAvailable") and "iPhone" in (row.get("name") or ""):
                      devices.append((runtime, row["udid"], row["name"]))
          if not devices:
              print("::error::No available iPhone simulator; ForgeSwiftTests would stay un-run.")
              sys.exit(1)
          devices.sort(reverse=True)
          udid = devices[0][1]
          print(f"Using simulator {devices[0][2]} ({udid}) on {devices[0][0]}")
          open("/tmp/ios-sim-udid", "w").write(udid)
          PY
          UDID=$(cat /tmp/ios-sim-udid)
          xcodebuild \
            -project ForgeSwift.xcodeproj \
            -scheme ForgeSwift \
            -destination "platform=iOS Simulator,id=$UDID" \
            -configuration Debug \
            -skipPackagePluginValidation \
            test \
            -only-testing:ForgeSwiftTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee /tmp/ios-test.log


      - name: Build ForgeSwift + tests (iOS Simulator)
        if: needs.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          # `build-for-testing` rather than `build`, so the ForgeSwiftTests
          # bundle is compiled as well. A test target CI never builds is a test
          # target that silently rots. It compiles against the generic
          # destination, so no simulator runtime has to be installed — actually
          # *running* the tests needs a booted simulator, which is a separate
          # change carrying its own runtime-availability risk.
          xcodebuild \
            -project ForgeSwift.xcodeproj \
            -scheme ForgeSwift \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -skipPackagePluginValidation \
            build-for-testing \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=x86_64 \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee /tmp/ios-build.log

      # xcodebuild logs run to ~2000 lines and bury `error:` lines thousands of
      # lines above the failure summary, which makes a red build genuinely hard
      # to diagnose from the web UI. Echo just the diagnostics at the end.
      - name: Compile errors (iOS)
        if: failure() && needs.changes.outputs.relevant == 'true'
        run: |
          echo "::group::Swift errors"
          if test -f /tmp/ios-test.log; then
            grep -E "error: |failed \(|XCTAssert" /tmp/ios-test.log | sed 's|/Users/runner/work/Forge/Forge/||' | sort -u || true
          fi
          test -f /tmp/ios-build.log || { echo "(build did not reach this step)"; exit 0; }
          grep -E "error: " /tmp/ios-build.log | sed 's|/Users/runner/work/Forge/Forge/||' | sort -u || echo "(no error: lines matched)"
          echo "::endgroup::"

      - name: Build ForgeWatch + Widgets (watchOS Simulator)
        # Scheme builds ForgeWatch and embeds ForgeWatchWidgets with package
        # products resolved. Do not use bare -target for widgets — SPM product
        # linkage (ForgeCore) is not applied the same way without the scheme.
        if: needs.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -project ForgeSwift.xcodeproj \
            -scheme ForgeWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            -skipPackagePluginValidation \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee /tmp/watch-build.log

      - name: Compile errors (watchOS)
        if: failure() && needs.changes.outputs.relevant == 'true'
        run: |
          echo "::group::Swift errors"
          test -f /tmp/watch-build.log || { echo "(build did not reach this step)"; exit 0; }
          grep -E "error: " /tmp/watch-build.log | sed 's|/Users/runner/work/Forge/Forge/||' | sort -u || echo "(no error: lines matched)"
          echo "::endgroup::"

      # Everything above builds Debug, which is the configuration that runs
      # `#if DEBUG` and never the `#else`. Shipping code now has both branches —
      # the demo fixtures in Models.swift and the chat seed in AppStore+Chat are
      # compiled out of Release — so a Debug-only pipeline cannot see an error
      # in the half of the code that actually ships. Release also turns on
      # whole-module optimization, which diagnoses some things Debug does not.
      # It roughly doubles this job; the alternative is finding out at archive
      # time, or from the App Store.
      - name: Build ForgeSwift (iOS, Release)
        if: needs.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -project ForgeSwift.xcodeproj \
            -scheme ForgeSwift \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -skipPackagePluginValidation \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=x86_64 \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee /tmp/ios-release.log

      - name: Compile errors (iOS, Release)
        if: failure() && needs.changes.outputs.relevant == 'true'
        run: |
          echo "::group::Swift errors"
          test -f /tmp/ios-release.log || { echo "(build did not reach this step)"; exit 0; }
          grep -E "error: " /tmp/ios-release.log | sed 's|/Users/runner/work/Forge/Forge/||' | sort -u || echo "(no error: lines matched)"
          echo "::endgroup::"

      # Production proof. Debug and TestFlight carry the Dummy orchestra
      # (FORGE_DUMMY_ORCHESTRA via the project's FORGE_DUMMY_ORCHESTRA_CONDITION);
      # a production archive passes FORGE_DUMMY_ORCHESTRA_CONDITION= and the
      # Dummy compiles out behind AriaDummyOrchestra. Without this step nothing
      # would notice a production file quietly starting to depend on it again:
      # the app must still build, and no Dummy type may reach the binary.
      - name: Build ForgeSwift (iOS, Release, Dummy stripped)
        if: needs.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -project ForgeSwift.xcodeproj \
            -scheme ForgeSwift \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath /tmp/dd-no-dummy \
            -skipPackagePluginValidation \
            build \
            FORGE_DUMMY_ORCHESTRA_CONDITION= \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            EXCLUDED_ARCHS=x86_64 \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee /tmp/ios-release-no-dummy.log
          bin=/tmp/dd-no-dummy/Build/Products/Release-iphonesimulator/ForgeSwift.app/ForgeSwift
          test -f "$bin"
          if grep -a -q -E "AriaDummyOrchestrator|AriaDummyTurn|SyntheticMessageProvider" "$bin"; then
            echo "::error::Dummy orchestra types found in the stripped production binary"
            exit 1
          fi
          echo "Dummy orchestra (and the synthetic Messages provider) absent from the production binary."

      - name: Compile errors (iOS, Release, Dummy stripped)
        if: failure() && needs.changes.outputs.relevant == 'true'
        run: |
          echo "::group::Swift errors"
          test -f /tmp/ios-release-no-dummy.log || { echo "(build did not reach this step)"; exit 0; }
          grep -E "error: " /tmp/ios-release-no-dummy.log | sed 's|/Users/runner/work/Forge/Forge/||' | sort -u || echo "(no error: lines matched)"
          echo "::endgroup::"

      - name: Build ForgeWatch + Widgets (watchOS, Release)
        if: needs.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -project ForgeSwift.xcodeproj \
            -scheme ForgeWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Release \
            -skipPackagePluginValidation \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee /tmp/watch-release.log

      - name: Compile errors (watchOS, Release)
        if: failure() && needs.changes.outputs.relevant == 'true'
        run: |
          echo "::group::Swift errors"
          test -f /tmp/watch-release.log || { echo "(build did not reach this step)"; exit 0; }
          grep -E "error: " /tmp/watch-release.log | sed 's|/Users/runner/work/Forge/Forge/||' | sort -u || echo "(no error: lines matched)"
          echo "::endgroup::"
