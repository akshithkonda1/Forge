name: 'Terraform'

# Checks (fmt / validate / plan with -backend=false) run on every branch and every
# pull request. The live apply is gated separately inside the terraform-apply job,
# so widening this trigger does not widen who can deploy.
on:
  push:
    paths:
      - '.github/workflows/terraform.yml'
      - 'backend/infra/**'
  pull_request:
    paths:
      - '.github/workflows/terraform.yml'
      - 'backend/infra/**'
  workflow_dispatch:
    inputs:
      run_apply:
        description: Force a real terraform apply (requires AWS credentials)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: backend/infra
  # var.environment has no default on purpose: it decides whether the API accepts
  # unsigned dev-override tokens and whether seeded demo data stands in for real
  # health metrics. Naming it here keeps that choice visible at the deploy
  # definition instead of buried in a variable default. Change this to "prod"
  # when this workflow is the thing deploying the production stack.
  TF_VAR_environment: dev

jobs:
  terraform-checks:
    name: 'Terraform Checks'
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_skip_aws_provider_checks: "true"

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.0

      - name: Terraform Init
        run: terraform init -backend=false -input=false -lockfile=readonly -no-color

      - name: Terraform Format
        run: terraform fmt -check -diff -recursive -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

  terraform-apply:
    name: 'Terraform Apply'
    needs: terraform-checks
    if: needs.terraform-checks.result == 'success'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.0

      # Gated on `main`, which is the branch that actually exists.
      #
      # This previously gated on refs/heads/claude/forge-fitness-frontend-TwlOQ,
      # a scaffold branch long since deleted, so the condition could never be
      # true: this step never ran, the apply step below depends on its outcome,
      # and Terraform has therefore never deployed from CI at all. Every run
      # quietly took the plan-only path and reported success.
      #
      # What this now does on a push to main: apply to the environment named by
      # TF_VAR_environment at the top of this file, which is `dev`. Still doubly
      # gated — `continue-on-error` here means an environment with no AWS
      # secrets configured skips the apply and falls through to plan validation
      # rather than failing. Pull requests never apply.
      #
      # Before pointing this at production, change TF_VAR_environment to "prod"
      # deliberately: it decides whether the API accepts unsigned dev-override
      # tokens and whether seeded demo data stands in for real health metrics.
      - name: Configure AWS credentials
        id: aws-creds
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'workflow_dispatch' && inputs.run_apply == true)
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Terraform Init (deploy)
        if: steps.aws-creds.outcome == 'success'
        run: terraform init -input=false -no-color

      - name: Terraform Apply (deploy)
        if: >-
          steps.aws-creds.outcome == 'success'
          && (
            (github.event_name == 'push' && github.ref == 'refs/heads/main')
            || (github.event_name == 'workflow_dispatch' && inputs.run_apply == true)
          )
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          TF_VAR_skip_aws_provider_checks: "false"
        run: terraform apply -auto-approve -input=false -no-color

      - name: Terraform Plan (apply validation)
        if: >-
          github.event_name == 'pull_request'
          || steps.aws-creds.outcome != 'success'
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          TF_VAR_skip_aws_provider_checks: "true"
        run: |
          terraform init -backend=false -input=false -lockfile=readonly -no-color
          terraform plan -input=false -no-color
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Apply validated for PR — live deploy runs after merge when AWS credentials are configured."
          else
            echo "Skipped live apply because AWS credentials are not configured."
          fi