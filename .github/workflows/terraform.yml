name: Terraform

on:
  push:
    branches: [claude/forge-fitness-frontend-TwlOQ]
    paths:
      - '.github/workflows/terraform.yml'
      - 'backend/api/**'
      - 'infra/terraform/**'
  pull_request:
    paths:
      - '.github/workflows/terraform.yml'
      - 'backend/api/**'
      - 'infra/terraform/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/terraform

jobs:
  terraform-checks:
    name: Terraform Checks
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_VAR_skip_aws_provider_checks: 'true'

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.0

      - name: Terraform Init
        run: terraform init -backend=false -input=false -lockfile=readonly -no-color

      - name: Terraform Format
        run: terraform fmt -check -diff -recursive -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

  terraform-apply:
    name: Terraform Apply
    if: github.ref == 'refs/heads/claude/forge-fitness-frontend-TwlOQ' && github.event_name == 'push'
    needs: terraform-checks
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_VAR_skip_aws_provider_checks: 'false'

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.0

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -no-color

      - name: Post-deploy health check
        run: |
          HEALTH_URL="$(terraform output -raw healthcheck_url)"
          echo "Checking ${HEALTH_URL}"
          for i in $(seq 1 12); do
            if curl -sf "${HEALTH_URL}" | python3 -c 'import json,sys; assert json.load(sys.stdin).get("status")=="ok"'; then
              echo "Deploy healthy"
              exit 0
            fi
            echo "Waiting for API... (${i}/12)"
            sleep 10
          done
          echo "Deployed API did not become healthy in time"
          exit 1

  terraform-apply-dispatch:
    name: Terraform Apply (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: terraform-checks
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_VAR_skip_aws_provider_checks: 'false'

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.0

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -no-color