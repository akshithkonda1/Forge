name: 'Terraform'

on:
  push:
    branches: [ "claude/forge-fitness-frontend-TwlOQ" ]
    paths:
      - '.github/workflows/terraform.yml'
      - 'infra/terraform/**'
  pull_request:
    paths:
      - '.github/workflows/terraform.yml'
      - 'infra/terraform/**'

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-checks:
    name: 'Terraform Checks'
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_skip_aws_provider_checks: "true"

    defaults:
      run:
        shell: bash
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.0

      - name: Terraform Init
        run: terraform init -backend=false -input=false -lockfile=readonly -no-color

      - name: Terraform Format
        run: terraform fmt -check -diff -recursive -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

  terraform-apply:
    name: 'Terraform Apply'
    if: github.ref == 'refs/heads/claude/forge-fitness-frontend-TwlOQ' && github.event_name == 'push'
    needs: terraform-checks
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_skip_aws_provider_checks: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      AWS_ACCESS_KEY_ID: ${{ github.event_name == 'pull_request' && 'terraform-ci-placeholder' || secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ github.event_name == 'pull_request' && 'terraform-ci-placeholder' || secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ github.event_name == 'pull_request' && 'terraform-ci-placeholder' || secrets.AWS_SESSION_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Format
        run: terraform fmt -check -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/claude/forge-fitness-frontend-TwlOQ' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false -no-color
