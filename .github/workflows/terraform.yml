name: 'Terraform'

on:
  push:
    branches: [ "claude/forge-fitness-frontend-TwlOQ" ]
    paths:
      - '.github/workflows/terraform.yml'
      - 'infra/terraform/**'
  pull_request:
    paths:
      - '.github/workflows/terraform.yml'
      - 'infra/terraform/**'
  workflow_dispatch:
    inputs:
      run_apply:
        description: Force a real terraform apply (requires AWS credentials)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/terraform

jobs:
  terraform-checks:
    name: 'Terraform Checks'
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_skip_aws_provider_checks: "true"

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.0

      - name: Terraform Init
        run: terraform init -backend=false -input=false -lockfile=readonly -no-color

      - name: Terraform Format
        run: terraform fmt -check -diff -recursive -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

  terraform-apply:
    name: 'Terraform Apply'
    needs: terraform-checks
    if: needs.terraform-checks.result == 'success'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.0

      - name: Configure AWS credentials
        id: aws-creds
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/claude/forge-fitness-frontend-TwlOQ')
          || (github.event_name == 'workflow_dispatch' && inputs.run_apply == true)
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Terraform Init (deploy)
        if: steps.aws-creds.outcome == 'success'
        run: terraform init -input=false -no-color

      - name: Terraform Apply (deploy)
        if: >-
          steps.aws-creds.outcome == 'success'
          && (
            (github.event_name == 'push' && github.ref == 'refs/heads/claude/forge-fitness-frontend-TwlOQ')
            || (github.event_name == 'workflow_dispatch' && inputs.run_apply == true)
          )
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          TF_VAR_skip_aws_provider_checks: "false"
        run: terraform apply -auto-approve -input=false -no-color

      - name: Terraform Plan (apply validation)
        if: >-
          github.event_name == 'pull_request'
          || steps.aws-creds.outcome != 'success'
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          TF_VAR_skip_aws_provider_checks: "true"
        run: |
          terraform init -backend=false -input=false -lockfile=readonly -no-color
          terraform plan -input=false -no-color
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Apply validated for PR — live deploy runs after merge when AWS credentials are configured."
          else
            echo "Skipped live apply because AWS credentials are not configured."
          fi