# Replaced by deploy-chain.yml (Phase 1–3).
# Kept for manual terraform-only runs.

name: Terraform (manual)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Run terraform apply after checks
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/terraform

jobs:
  checks:
    name: Terraform Checks
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_VAR_skip_aws_provider_checks: 'true'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.0
      - run: terraform init -backend=false -input=false -lockfile=readonly -no-color
      - run: terraform fmt -check -diff -recursive -no-color
      - run: terraform validate -no-color
      - run: terraform plan -input=false -no-color

  apply:
    name: Terraform Apply
    if: inputs.apply == true
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_VAR_skip_aws_provider_checks: 'false'
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.0
      - run: terraform init -input=false -no-color
      - run: terraform apply -auto-approve -input=false -no-color