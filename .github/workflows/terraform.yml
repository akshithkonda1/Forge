name: 'Terraform'

on:
  push:
    branches: [ "claude/forge-fitness-frontend-TwlOQ" ]
    paths:
      - '.github/workflows/terraform.yml'
      - 'infra/terraform/**'
  pull_request:
    paths:
      - '.github/workflows/terraform.yml'
      - 'infra/terraform/**'

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_skip_aws_provider_checks: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}

    defaults:
      run:
        shell: bash
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Format
        run: terraform fmt -check -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/claude/forge-fitness-frontend-TwlOQ' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false -no-color
