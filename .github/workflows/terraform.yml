name: 'Terraform'

# Plan-only on every push and pull request that touches this workflow or
# backend/infra. A live apply never runs from those events.
# Apply is workflow_dispatch + run_apply=true only, in terraform-apply, after
# the plan jobs and after GitHub Environment terraform-prod approval.
on:
  push:
    paths:
      - '.github/workflows/terraform.yml'
      - 'backend/infra/**'
  pull_request:
    paths:
      - '.github/workflows/terraform.yml'
      - 'backend/infra/**'
  workflow_dispatch:
    inputs:
      run_apply:
        description: Force a real terraform apply (requires AWS credentials)
        type: boolean
        default: false

permissions:
  contents: read

# Plan runs on the same ref cancel each other. An in-progress apply uses its
# own group and is never cancelled (see terraform-apply.concurrency).
concurrency:
  group: terraform-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.run_apply && 'apply' || 'plan' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.run_apply) }}

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: backend/infra
  # var.environment has no default on purpose: it decides whether the API accepts
  # unsigned dev-override tokens and whether seeded demo data stands in for real
  # health metrics. Naming it here keeps that choice visible at the deploy
  # definition instead of buried in a variable default. Change this to "prod"
  # when this workflow is the thing deploying the production stack.
  TF_VAR_environment: dev

jobs:
  terraform-checks:
    name: 'Terraform Checks'
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_skip_aws_provider_checks: "true"

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.0

      # Force a local backend so plan stays green both before and after #371
      # adds backend/infra/backend.tf (backend "s3" {} with bucket/key omitted).
      # Without this, `init -backend=false` then `plan` fails with
      # "Backend initialization required". *_override.tf is gitignored.
      # Plan jobs never touch AWS (metadata disabled, provider checks skipped).
      # One-line `terraform { backend "local" {} }` is invalid HCL in 1.15.0
      # (nested backend block cannot share the terraform {} line).
      - name: Local backend override for CI plan
        run: |
          printf '%s\n' 'terraform {' '  backend "local" {}' '}' > ci_backend_override.tf

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly -no-color

      - name: Terraform Format
        run: terraform fmt -check -diff -recursive -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

  terraform-prod-plan:
    name: 'Terraform Plan (prod)'
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_skip_aws_provider_checks: "true"

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.0

      # Same local override as terraform-checks. See that job for why.
      - name: Local backend override for CI plan
        run: |
          printf '%s\n' 'terraform {' '  backend "local" {}' '}' > ci_backend_override.tf

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly -no-color

      - name: Terraform Plan (prod)
        run: terraform plan -input=false -no-color -var-file=prod.tfvars

  # Applies TF_VAR_environment=dev (workflow env) despite the terraform-prod
  # environment gate. Switching to prod.tfvars plus a saved plan is a separate
  # later change after #371.
  terraform-apply:
    name: 'Terraform Apply (dev, approval-gated)'
    needs: [terraform-checks, terraform-prod-plan]
    if: github.event_name == 'workflow_dispatch' && inputs.run_apply == true
    environment: terraform-prod
    runs-on: ubuntu-latest
    # Two applies must not overlap. Never cancel an apply that has started.
    concurrency:
      group: terraform-apply-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Refuse apply when the only backend would be local state on this runner.
      # Ephemeral runner disks are discarded after the job, so the next apply
      # would not see existing resources and would create duplicates.
      # Checks backend.tf and versions.tf only (not *_override.tf). Ignores
      # comments and does not treat backend "local" as remote.
      - name: Refuse apply without a remote backend
        run: |
          found=0
          for f in backend.tf versions.tf; do
            [ -f "$f" ] || continue
            if grep -E '^[[:space:]]*backend[[:space:]]+"' "$f" \
              | grep -vE '^[[:space:]]*backend[[:space:]]+"local"' >/dev/null; then
              found=1
              break
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo '::error::No remote backend block found in backend/infra/backend.tf or backend/infra/versions.tf (expected in backend/infra/versions.tf). Refusing apply: ephemeral local state on a runner would create duplicate resources. Commented lines and backend "local" do not count.'
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.0

      - name: Require AWS credentials
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ] && { [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; }; then
            echo '::error::AWS credentials are missing. Configure AWS_ROLE_ARN (OIDC) or AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY before requesting an apply.'
            exit 1
          fi

      - name: Configure AWS credentials
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Credentials failed
        if: always() && steps.aws-creds.outcome == 'failure'
        run: |
          echo '::error::AWS credentials failed. Apply cannot continue without working credentials.'
          exit 1

      - name: Require remote state bucket and backend config
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo '::error::Repository variable TF_STATE_BUCKET is empty. Set it to the S3 Terraform state bucket before apply. Never hardcode a bucket.'
            exit 1
          fi
          if [ ! -f backend/dev.s3.tfbackend ]; then
            echo '::error::backend/infra/backend/dev.s3.tfbackend is missing. Apply needs this file plus TF_STATE_BUCKET.'
            exit 1
          fi

      - name: Terraform Init (deploy)
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -no-color -backend-config=backend/dev.s3.tfbackend -backend-config=bucket=${TF_STATE_BUCKET}

      - name: Terraform Apply (deploy)
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          TF_VAR_skip_aws_provider_checks: "false"
        run: terraform apply -auto-approve -input=false -no-color
