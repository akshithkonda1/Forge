# Run the ARIA SimRunner unit suite + an offline smoke on PRs.
# SimRunner is stdlib-only, so there is no dependency install step.
# Dummy regression / tier-1 HOLD is a separate job (not the required check).

name: SimRunner

# pull_request is unfiltered so required checks always report. Push keeps a
# path filter. backend/infra/lambda/** is included because SimRunner imports
# the production engine from there.
on:
  push:
    paths:
      - "backend/ai/**"
      - "backend/simrunner/**"
      - "backend/infra/lambda/**"
      - ".github/workflows/simrunner.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: simrunner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: simrunner-changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - "backend/ai/**"
              - "backend/simrunner/**"
              - "backend/infra/lambda/**"
              - ".github/workflows/simrunner.yml"

  test:
    name: simrunner-unit
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: No-op (no relevant changes)
        if: needs.changes.outputs.relevant != 'true'
        run: echo "No SimRunner changes; succeeding as a no-op so required checks report."

      # Actions must be pinned to a full-length commit SHA (repo policy).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.relevant == 'true'

      # No setup-python: the harness is stdlib-only and Python 3.10+, so the
      # runner's system python3 (3.12 on ubuntu-24.04) is sufficient.
      - name: Unit + property + determinism tests
        if: needs.changes.outputs.relevant == 'true'
        run: python3 -m unittest discover -s backend/ai/simrunner/tests -p "test_*.py" -v

      - name: Tier-1 smoke (offline, no network, no tokens)
        if: needs.changes.outputs.relevant == 'true'
        run: python3 -m backend.ai.simrunner

      - name: Test-Ready dummy smoke (no AWS)
        if: needs.changes.outputs.relevant == 'true'
        run: python3 -m backend.ai.simrunner --test-ready --gate

  dummy-gate:
    name: simrunner-dummy-gate
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test-Ready product eval (dummy orchestra, fail on tier-1 HOLD)
        env:
          SIMRUNNER_TODAY: "2026-01-15"
        run: python3 -m backend.ai.simrunner --test-ready --tier 1 --gate

      # Regression gate: the full suite is re-graded against the committed golden
      # baselines and the run fails if any model's composite drops past
      # gate_max_drop or a new mission-critical failure appears. SIMRUNNER_TODAY
      # is pinned to the same date the baselines were generated with, so the
      # synthetic streams (and therefore the scores) are byte-reproducible.
      # Also fails if any tier-1 persona is HOLD.
      - name: Regression gate (all 23 archetypes vs committed baseline)
        env:
          SIMRUNNER_TODAY: "2026-01-15"
        run: python3 -m backend.ai.simrunner --all --gate

      # Generated output only. lifetime_suite writes reports/ + comparison.json
      # (and reports/test_ready/ for --test-ready). Committed baselines/ are
      # inputs (--compare/--gate), not CI output — this workflow never passes
      # --baseline. if: always() keeps reports after a red gate.
      - name: Upload SimRunner reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simrunner-reports
          path: |
            backend/ai/simrunner/reports/
          if-no-files-found: warn
          retention-days: 14
