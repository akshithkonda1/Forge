# Legacy ECS workflow — Forge deploys via Terraform Lambda (see terraform.yml).
# Kept as manual-only so placeholder env vars do not break CI on every push.

name: Deploy to Amazon ECS (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: ECS deploy disabled
        run: |
          echo "Forge uses serverless Lambda deploy via .github/workflows/terraform.yml"
          echo "Run the Terraform workflow instead."
          exit 1