# Extra same-SHA launch-stability runs for draft PR #549 evidence.
# Does not change thresholds, scoring, warm-ups, or retries. The token on
# this workflow can workflow_dispatch; the agent token cannot.
name: Extra Launch Stability Evidence

on:
  pull_request:

permissions:
  actions: write
  contents: read

concurrency:
  group: extra-launch-stability-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: dispatch-two-more
    if: github.head_ref == 'sable/launch-cleanup-oct31'
    runs-on: ubuntu-latest
    steps:
      - name: workflow_dispatch launch-stability twice on this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          REF="${{ github.head_ref }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "Dispatching launch-stability.yml ref=$REF sha=$SHA"
          # Let the pull_request launch-stability run claim the concurrency
          # group first so these two queue behind it instead of racing.
          sleep 20
          gh workflow run launch-stability.yml --ref "$REF"
          sleep 8
          gh workflow run launch-stability.yml --ref "$REF"
          echo "Dispatched two workflow_dispatch runs"
