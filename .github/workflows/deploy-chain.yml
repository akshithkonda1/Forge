# Three-phase deployment chain: Test → Fix/Improve → Deploy
#
# Phase 1  Test        — unit tests, smoke tests, terraform plan, optional Swift build
# Phase 2  Fix/Improve — package Lambda zip, compile checks, terraform fmt/validate
# Phase 3  Deploy      — terraform apply + post-deploy health check (default branch only)

name: Deploy Chain

on:
  push:
    branches: [claude/forge-fitness-frontend-TwlOQ]
  pull_request:
    branches: [claude/forge-fitness-frontend-TwlOQ]
  workflow_dispatch:
    inputs:
      run_deploy:
        description: Run Phase 3 deploy (requires production environment approval)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/terraform
  PYTHON_VERSION: '3.12'
  TERRAFORM_VERSION: 1.15.0

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.changes.outputs.swift }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi

          CHANGED="$(git diff --name-only "${BASE_SHA}" HEAD || true)"
          echo "Changed files:"
          echo "${CHANGED}"

          if echo "${CHANGED}" | grep -qE '^(ForgeSwift/|Forge\.xcworkspace/)'; then
            echo "swift=true" >> "${GITHUB_OUTPUT}"
          else
            echo "swift=false" >> "${GITHUB_OUTPUT}"
          fi

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 1 — TEST
  # ═══════════════════════════════════════════════════════════════════

  phase1-test-backend:
    name: 'Phase 1 · Test Backend'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Unit tests
        run: python3 scripts/run_tests.py

      - name: Smoke test (local dev server)
        run: |
          python3 backend/dev_server.py &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health >/dev/null; then
              break
            fi
            sleep 1
          done
          FORGE_API_BASE_URL=http://127.0.0.1:3001 python3 scripts/smoke_test.py

  phase1-test-terraform:
    name: 'Phase 1 · Test Terraform'
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_VAR_skip_aws_provider_checks: 'true'

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        run: terraform init -backend=false -input=false -lockfile=readonly -no-color

      - name: Terraform format check
        run: terraform fmt -check -diff -recursive -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color

  phase1-test-swift:
    name: 'Phase 1 · Test Swift'
    runs-on: macos-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.swift == 'true'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n1)"

      - name: Build ForgeSwift
        run: |
          xcodebuild build \
            -project ForgeSwift/ForgeSwift.xcodeproj \
            -scheme ForgeSwift \
            -destination 'generic/platform=iOS Simulator' \
            -destination-timeout 5 \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 2 — FIX / IMPROVE
  # ═══════════════════════════════════════════════════════════════════

  phase2-fix-improve:
    name: 'Phase 2 · Fix / Improve'
    runs-on: ubuntu-latest
    needs:
      - phase1-test-backend
      - phase1-test-terraform
      - phase1-test-swift
    if: |
      always() &&
      (needs.phase1-test-backend.result == 'success' || needs.phase1-test-backend.result == 'skipped') &&
      (needs.phase1-test-terraform.result == 'success' || needs.phase1-test-terraform.result == 'skipped') &&
      (needs.phase1-test-swift.result == 'success' || needs.phase1-test-swift.result == 'skipped') &&
      needs.phase1-test-backend.result != 'failure' &&
      needs.phase1-test-terraform.result != 'failure' &&
      needs.phase1-test-swift.result != 'failure'

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run fix/improve checks
        run: python3 scripts/ci_fix_improve.py

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-backend-lambda
          path: infra/terraform/build/forge-backend.zip
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 3 — DEPLOY
  # ═══════════════════════════════════════════════════════════════════

  phase3-deploy:
    name: 'Phase 3 · Deploy'
    runs-on: ubuntu-latest
    needs: phase2-fix-improve
    if: |
      needs.phase2-fix-improve.result == 'success' &&
      (
        (github.ref == 'refs/heads/claude/forge-fitness-frontend-TwlOQ' && github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_deploy == true)
      )
    environment: production
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_VAR_skip_aws_provider_checks: 'false'

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download Lambda artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: forge-backend-lambda
          path: build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false -no-color

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false -no-color

      - name: Post-deploy health check
        run: |
          HEALTH_URL="$(terraform output -raw healthcheck_url)"
          echo "Checking ${HEALTH_URL}"
          for i in $(seq 1 12); do
            if curl -sf "${HEALTH_URL}" | python3 -c 'import json,sys; assert json.load(sys.stdin).get("status")=="ok"'; then
              echo "Deploy healthy"
              exit 0
            fi
            echo "Waiting for API... (${i}/12)"
            sleep 10
          done
          echo "Deployed API did not become healthy in time"
          exit 1

      - name: Post-deploy smoke test
        run: |
          HEALTH_URL="$(terraform output -raw healthcheck_url)"
          BASE="${HEALTH_URL%/health}"
          FORGE_API_BASE_URL="${BASE}" python3 "${{ github.workspace }}/scripts/smoke_test.py"