# Gates the Next.js/TypeScript frontend: lint + typecheck + test + production build.
# Lint is now gated (flat eslint.config.mjs; settings.react.version pinned because
# eslint-plugin-react 'detect' uses context.getFilename(), removed in ESLint 10).
# pnpm comes from Corepack (the packageManager field), so no setup-node is needed.

name: Frontend CI

# Runs on every branch and every pull request — main included. Path filters scope
# it to the frontend; there is deliberately no branch filter.
on:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - "vitest.config.mts"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - "vitest.config.mts"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Enable pnpm (Corepack)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
