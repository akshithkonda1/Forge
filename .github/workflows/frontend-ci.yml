# Gates the Next.js/TypeScript frontend: lint + typecheck + test + production build.
# Lint is now gated (flat eslint.config.mjs; settings.react.version pinned because
# eslint-plugin-react 'detect' uses context.getFilename(), removed in ESLint 10).
# pnpm comes from Corepack (the packageManager field). setup-node pins Node 22
# so `node --experimental-strip-types` can run the ARIA frontend contract.

name: Frontend CI

# Runs on every branch and every pull request — main included. Path filters scope
# it to the frontend; there is deliberately no branch filter.
on:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - "vitest.config.mts"
      - "shared/**"
      - "scripts/check-aria-frontend.ts"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - "vitest.config.mts"
      - "shared/**"
      - "scripts/check-aria-frontend.ts"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Enable pnpm (Corepack)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      # Drift gate: src/lib/aria-mark.ts must stay lockstep with
      # shared/aria-mark.json. This script existed but was never a CI step, so
      # a contract-only edit of shared/ also skipped this workflow (path
      # filter omitted shared/**).
      - name: ARIA frontend contract
        run: node --experimental-strip-types scripts/check-aria-frontend.ts

      - name: Build
        run: pnpm build
