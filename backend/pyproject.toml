[project]
name = "forge-backend"
version = "0.1.0"
description = "Shared AWS backend for Forge iOS, web, and Android — ARIA, Lambda, Terraform."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary — not MIT. Fuck no, you can't copy our shit." }
authors = [{ name = "Akshith Konda" }]
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = []

[tool.pytest.ini_options]
testpaths = ["tests", "ai/simrunner/tests"]
python_files = ["test_*.py"]
