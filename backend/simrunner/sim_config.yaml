seed: 42
seed_count: 1                        # >1 enables multi-seed statistical confidence (--seeds overrides)
snapshot_days: [7, 14, 21, 29]      # which days in the 30-day stream to test
determinism_sample_size: 5           # prompts per tier for the determinism check
use_real_api: false                  # set true to call the Claude API (costs tokens)
gate_max_drop: 3.0                   # --gate fails if a composite regresses more than this many points
grade_thresholds:
  A_plus: 95
  A: 88
  B_plus: 80
  B: 72
  B_minus: 65
  C: 55
  C_minus: 45
critical_failure_threshold: 0        # directional_correctness score that flags a critical failure
report_format: both                  # text | json | both

# Which Bedrock model the harness ARIA engine uses, per routing tier.
engine_models:
  opus: anthropic.claude-opus-4-8
  sonnet: anthropic.claude-sonnet-4-6
# engine_model: anthropic.claude-opus-4-8   # uncomment to pin ALL queries to one model
# Override either at runtime with SIMRUNNER_ENGINE_MODEL=<bedrock-id>
